name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/*/package-lock.json

      # Root holds the shared toolchain (eslint, prettier, vitest, typescript).
      - name: Install root toolchain
        run: npm ci

      # The widget package carries its own deps (its tsc, RN types, runtime).
      # Needed for its typecheck/build and for the tests to resolve
      # package-local imports (react-native, react-native-svg, etc.).
      - name: Install package deps
        run: npm ci --prefix packages/components

      # The WMX wrapper package carries its own deps too (@wavemaker/app-rn-runtime,
      # its own react-native, adm-zip for zipping) — needed for its typecheck/build.
      - name: Install wmx-components deps
        run: npm ci --prefix packages/wmx-components

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
